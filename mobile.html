<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>forget me not</title>
  <link rel="stylesheet" href="https://use.typekit.net/qmj4lyf.css">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { width: 100%; height: 100%; }

    body {
      font-family: 'slight-chance', sans-serif;
      background: #f0e8e0;
      color: #1a1a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
    }

    .flower {
      width: min(180px, 50vw);
      height: auto;
      margin-bottom: 2rem;
      opacity: 0.92;
    }

    .brand {
      font-family: 'slight-chance', sans-serif;
      font-size: clamp(2rem, 10vw, 3rem);
      line-height: 0.95;
      margin-bottom: 1.8rem;
      color: #1a1a1a;
    }

    .divider {
      width: 40px;
      height: 2px;
      background: #b0d2dc;
      border-radius: 999px;
      margin: 0 auto 1.8rem;
    }

    .message {
      font-size: clamp(0.78rem, 3.5vw, 0.95rem);
      line-height: 1.85;
      letter-spacing: 0.02em;
      color: #444;
      max-width: 300px;
      margin-bottom: 2.2rem;
    }

    .btn-row {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      width: 100%;
      max-width: 260px;
    }

    .btn {
      font-family: 'slight-chance', sans-serif;
      font-size: clamp(0.72rem, 3vw, 0.88rem);
      letter-spacing: 0.04em;
      text-transform: lowercase;
      padding: 0.75rem 1.8rem;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      text-decoration: none;
      display: block;
      text-align: center;
    }

    .btn-continue {
      background: rgba(176,210,220,0.55);
      border: 2px solid #1a1a1a;
      color: #1a1a1a;
    }
    .btn-continue:hover { background: rgba(176,210,220,0.85); transform: translateY(-2px); }

    .btn-back {
      background: transparent;
      border: 2px solid rgba(0,0,0,0.25);
      color: #555;
    }
    .btn-back:hover { background: rgba(0,0,0,0.05); transform: translateY(-2px); }
  </style>
</head>
<body>

  <img class="flower" src="unit_8_flower.png" alt="forget me not flower">
  <h1 class="brand">forget<br>me not</h1>
  <div class="divider"></div>

  <p class="message">this page may not display properly on a mobile device. would you like to continue anyway?</p>

  <div class="btn-row">
    <a id="btn-continue" class="btn btn-continue" href="index.html">yes, continue</a>
    <a id="btn-back" class="btn btn-back" href="#" onclick="history.back(); return false;">go back</a>
  </div>

  <script>
    // Derive the originating page from the query string, then referrer, then default to index.html
    var params = new URLSearchParams(window.location.search);
    var origin = params.get('from') || document.referrer;

    // Strip to just the filename so relative links work
    if (origin) {
      try { origin = new URL(origin).pathname.split('/').pop() || 'index.html'; } catch(e) {}
    }
    if (!origin || origin === 'mobile.html') origin = 'index.html';

    var btn = document.getElementById('btn-continue');
    btn.removeAttribute('href');
    btn.addEventListener('click', function(e) {
      e.preventDefault();
      sessionStorage.setItem('allowMobile', '1');
      window.location.assign(origin);
    });
  </script>

</body>
</html>
