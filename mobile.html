<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>forget me not</title>
  
  
  <link rel="stylesheet" href="https://use.typekit.net/qmj4lyf.css">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: 'Space Mono', monospace;
      background: #f0e8e0;
      color: #1a1a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
    }

    .flower {
      width: min(220px, 55vw);
      height: auto;
      margin-bottom: 2.5rem;
      opacity: 0.92;
    }

    .brand {
      font-family: 'slight-chance', sans-serif;
      font-size: clamp(2.2rem, 10vw, 3rem);
      line-height: 0.95;
      margin-bottom: 2rem;
      color: #1a1a1a;
    }

    .message {
      font-size: clamp(0.78rem, 3.5vw, 1rem);
      line-height: 1.85;
      letter-spacing: 0.02em;
      color: #444;
      max-width: 320px;
    }

    .divider {
      width: 40px;
      height: 2px;
      background: #b0d2dc;
      border-radius: 999px;
      margin: 1.8rem auto;
    }
  </style>
</head>
<body>
  <img class="flower" src="unit_8_flower.png" alt="forget me not flower">
  <h1 class="brand">forget<br>me not</h1>
  <div class="divider"></div>
  <p class="message">Hello! This demonstration can only be viewed from the computer.</p>
</body>
</html>
